# Mosquitto config for CodeTrack (lab / docker-compose)
#
# SECURITY NOTES:
# - allow_anonymous is enabled for ESP32 desk-hub demos (firmware has no MQTT auth yet).
# - Prefer not publishing broker ports to the public internet.
# - For production: set allow_anonymous false, add password_file + ACL, enable TLS.

persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous true

# WebSockets (dashboard tooling / MQTT Explorer). Keep internal when possible.
listener 9001
protocol websockets
allow_anonymous true
